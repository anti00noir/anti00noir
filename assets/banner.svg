<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002263" />
      <stop offset="100%" stop-color="#000c26" />
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="900" height="200" fill="url(#bg)" />

  <!-- pixel border (top) -->
  <g fill="#c8aa58">
    <rect x="0" y="0" width="900" height="6" />
  </g>
  <!-- pixel border (bottom) -->
  <g fill="#c8aa58">
    <rect x="0" y="194" width="900" height="6" />
  </g>
  <!-- corner pixel ticks -->
  <g fill="#c8aa58">
    <rect x="0" y="0" width="12" height="20" />
    <rect x="888" y="0" width="12" height="20" />
    <rect x="0" y="180" width="12" height="20" />
    <rect x="888" y="180" width="12" height="20" />
  </g>

  <!-- 8-bit terrain silhouette bottom -->
  <g fill="#486023">
    <rect x="0" y="176" width="30" height="18" />
    <rect x="30" y="168" width="30" height="26" />
    <rect x="60" y="176" width="40" height="18" />
    <rect x="100" y="160" width="30" height="34" />
    <rect x="130" y="176" width="50" height="18" />
    <rect x="720" y="176" width="50" height="18" />
    <rect x="770" y="164" width="30" height="30" />
    <rect x="800" y="176" width="40" height="18" />
    <rect x="840" y="170" width="30" height="24" />
    <rect x="870" y="176" width="30" height="18" />
  </g>
  <g fill="#b34631">
    <rect x="0" y="188" width="900" height="6" />
  </g>

  <!-- pixel "cursor block" accents -->
  <rect x="40" y="60" width="14" height="14" fill="#a90021" />
  <rect x="846" y="60" width="14" height="14" fill="#a90021" />

  <!-- name -->
  <text x="450" y="88" font-family="Courier New, monospace" font-size="40" font-weight="bold"
        fill="#c8aa58" text-anchor="middle" letter-spacing="4">
    KABELO RABALAO
  </text>

  <!-- underline pixels -->
  <g fill="#b34631">
    <rect x="255" y="100" width="10" height="6" />
    <rect x="267" y="100" width="10" height="6" />
    <rect x="279" y="100" width="10" height="6" />
    <rect x="611" y="100" width="10" height="6" />
    <rect x="623" y="100" width="10" height="6" />
    <rect x="635" y="100" width="10" height="6" />
  </g>

  <!-- tagline -->
  <text x="450" y="135" font-family="Courier New, monospace" font-size="17"
        fill="#ffffff" text-anchor="middle" letter-spacing="2">
    &gt; SYSTEMS ENGINEER _ GAME DEVELOPER
  </text>

  <text x="450" y="160" font-family="Courier New, monospace" font-size="13"
        fill="#a90021" text-anchor="middle" letter-spacing="1">
    building worlds on solid architecture
  </text>
</svg>
